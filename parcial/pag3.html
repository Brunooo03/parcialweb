<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Agradecimiento a la Ing. Lili</title>
  <style>
    body {
      margin: 0;
      height: 100vh;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #81d4fa, #b3e5fc);
    }
    .filtro {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      backdrop-filter: blur(8px);
      z-index: 0;
    }
    .marquee-container {
      position: relative;
      width: 100%;
      overflow: hidden;
      height: 80px;
      z-index: 1;
    }
    .marquee {
      display: inline-block;
      white-space: nowrap;
      font-family: 'Arial Black', sans-serif;
      font-size: 2rem;
      color: #ffffff;
      text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
      animation: desplazar 10s linear infinite;
    }
    @keyframes desplazar {
      0%   { transform: translateX(100%); }
      100% { transform: translateX(-100%); }
    }
  </style>
</head>
<body>
  <div class="filtro"></div>
  <div class="marquee-container">
    <div class="marquee">
      Muchas gracias Ing. Lili por enseñarnos la materia Diseño Web
    </div>
  </div>
</body>
</html>
